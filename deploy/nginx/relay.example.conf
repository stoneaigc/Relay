# ============================================================================
# Relay 网关 · Nginx 子路径反代完整配置(带兜底规则)
# 场景:https://sh.fit2cloud.cn:8443/relay/ 对外暴露,后端 127.0.0.1:8081
# 用法:以下 location 块放入你的 server { listen 8443 ssl; ... } 内,
#       然后 nginx -t 校验 && nginx -s reload 生效。
# 版本要求:Relay >= v0.2.1(无尾斜杠入口自动重定向)。
# ============================================================================

# ---- ① 入口兜底:裸 /relay 与 /relay/ 统一落到管理后台 --------------------
# location /relay/ 只匹配带斜杠的子路径,裸 /relay 会落到别的规则或 404,
# 用精确匹配兜住这两个入口。
location = /relay  { return 301 /relay/admin/; }
location = /relay/ { return 301 /relay/admin/; }

# ---- ② 主代理:/relay/ 下所有请求转发网关 ---------------------------------
location /relay/ {
    # 尾部带 "/" = 剥离 /relay/ 前缀后转发(当前模式,需 Relay >= v0.2.1)。
    # 备选:去掉尾部 "/" 改为不剥前缀模式(proxy_pass http://127.0.0.1:8081;),
    #       两种模式 Relay 均支持,任选其一、不要混用其它路径规则。
    proxy_pass http://127.0.0.1:8081/;

    # ---- 透传真实客户端信息 ----
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header REMOTE-HOST       $remote_addr;

    # ---- WebSocket / 流式(SSE)必需:逐字透传,不缓冲 ----
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering             off;
    proxy_cache                 off;

    # ---- 长对话兜底:推理模型/长流式响应不被 nginx 掐断(默认 60s 太短) ----
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ---- 请求体兜底:多模态图片 base64 动辄数 MB(nginx 默认 1m 会 413) ----
    client_max_body_size 50m;

    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;
    add_header X-Cache $upstream_cache_status;
}

# ---- ③ 站点根路径兜底(可选):访问 https://host:8443/ 也进管理后台 --------
# 若该 server 只服务 Relay,放开下面这行;若还有其他业务,保持注释。
# location / { return 301 /relay/admin/; }
