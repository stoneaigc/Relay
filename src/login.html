<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f14">
<title>Relay · 统一登录</title>
<style>
  :root { color-scheme: light dark;
    --accent: #6366f1; --accent-2: #8b5cf6;
    --focus-ring: 0 0 0 3px rgba(99,102,241,.22);
  }
  /* 深色下 focus 环加亮一档,否则在暗底上不可感知 */
  @media (prefers-color-scheme: dark) {
    :root { --focus-ring: 0 0 0 3px rgba(129,140,248,.30); }
  }
  ::selection { background: rgba(99,102,241,.35); }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f5fa; color: #1a1d27; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0d0f14; color: #e8eaf2; } }

  .shell {
    width: 100%; max-width: 960px; display: grid; grid-template-columns: 1.08fr 1fr;
    border-radius: 24px; overflow: hidden;
    border: 1px solid #e4e6ef; box-shadow: 0 24px 60px rgba(30,35,60,.14);
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .shell { background: #161923; border-color: #262a38; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  }

  /* ---------- 左侧品牌叙事面板(固定深色,双主题一致) ---------- */
  .brand-panel {
    position: relative; overflow: hidden; color: #eef0ff;
    background: linear-gradient(158deg, #1e1b4b 0%, #312e81 46%, #4c1d95 100%);
    padding: 48px 44px; display: flex; flex-direction: column;
  }
  /* 直接子元素提层;必须先于 .glow/.brand-mark 的 absolute 规则,否则会把它们拉回文档流撑爆高度 */
  .brand-panel > * { position: relative; }
  /* 点阵网格 + 双光晕,纯 CSS 无外部资源 */
  .brand-panel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.5px);
    background-size: 22px 22px;
    mask-image: radial-gradient(ellipse 90% 80% at 30% 20%, #000 0%, transparent 75%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; opacity: .5; }
  .glow-a { width: 340px; height: 340px; left: -110px; bottom: -130px; background: #6366f1; }
  .glow-b { width: 260px; height: 260px; right: -80px; top: -90px; background: #a78bfa; opacity: .38; }
  @media (prefers-reduced-motion: no-preference) {
    .glow-a { animation: drift 11s ease-in-out infinite alternate; }
    .glow-b { animation: drift 14s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(34px,-26px) scale(1.12); } }
  }

  .brand-row { display: flex; align-items: center; gap: 12px; }
  .brand-row .name { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .brand-row .name em { font-style: normal; color: #c4b5fd; }

  .hero { margin-top: 40px; }
  .hero h1 { font-size: clamp(26px, 3.4vw, 34px); line-height: 1.25; font-weight: 800; letter-spacing: .3px; }
  .hero h1 em { font-style: normal; background: linear-gradient(92deg, #c7d2fe, #e9d5ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin-top: 10px; font-size: 13px; color: #b9bdf0; letter-spacing: .2px; }

  /* ---------- 中转站可视化:上游 → Relay → 你的应用 ---------- */
  .flow { margin-top: 36px; display: flex; align-items: center; }
  .flow-col { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .node { font-size: 12px; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    color: #c7cdfa; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .flow-col.out .node { color: #ddd6fe; background: rgba(139,92,246,.16); border-color: rgba(196,181,253,.28); }
  .flow-wire { flex: 1; min-width: 18px; height: 2px; margin: 0 6px;
    background: repeating-linear-gradient(90deg, rgba(196,181,253,.55) 0 6px, transparent 6px 12px);
    background-size: 12px 100%; border-radius: 1px; }
  @media (prefers-reduced-motion: no-preference) {
    .flow-wire { animation: wireflow 1.1s linear infinite; }
    @keyframes wireflow { to { background-position-x: 12px; } }
  }
  .flow-hub { position: relative; flex: none; display: grid; place-items: center; width: 64px; height: 64px; }
  .ring { position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(196,181,253,.55); opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .ring { animation: ringpulse 2.8s ease-out infinite; }
    .ring.r2 { animation-delay: 1.4s; }
    @keyframes ringpulse { 0% { transform: scale(.75); opacity: .75; } 70%, 100% { transform: scale(1.65); opacity: 0; } }
  }
  .flow-cap { display: block; margin-top: 10px; text-align: center; font-size: 11.5px; color: #a5abe8; letter-spacing: .3px; }
  .brand-foot { margin-top: auto; padding-top: 30px; font-size: 12px; color: #8f94d6; display: flex; align-items: center; gap: 8px; }
  .brand-foot .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
  @media (prefers-reduced-motion: no-preference) {
    .brand-foot .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }

  /* ---------- 右侧表单面板 ---------- */
  .form-panel { padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; }
  .form-panel h2 { font-size: 21px; font-weight: 750; }
  .form-panel .sub2 { margin-top: 6px; font-size: 13px; color: #8a8fa3; }
  @media (prefers-color-scheme: dark) { .form-panel .sub2 { color: #8b90a8; } }

  label { display: block; font-size: 12px; color: #8a8fa3; margin: 18px 0 6px; }
  .field { position: relative; }
  input { width: 100%; padding: 11px 42px 11px 13px; border: 1px solid #d5d8e4; border-radius: 11px; font-size: 14px;
    background: transparent; color: inherit; outline: none; caret-color: var(--accent);
    transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: #9aa0b4; }
  input:hover:not(:focus) { border-color: #b9bdd0; }
  input:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
  /* 深色模式:输入框微抬升出层次,占位符压暗防抢焦点 */
  @media (prefers-color-scheme: dark) {
    input { border-color: #333849; background: rgba(255,255,255,.03); }
    input::placeholder { color: #6b7085; }
    input:hover:not(:focus) { border-color: #4a5066; }
  }
  /* 自动填充修正:Chrome autofill 会强刷亮蓝底/黑字,用 1000px 内阴影盖回主题色 */
  input:-webkit-autofill {
    -webkit-text-fill-color: #1a1d27;
    -webkit-box-shadow: 0 0 0 1000px #ffffff inset;
    caret-color: #1a1d27;
    transition: background-color 9999s ease-out;
  }
  @media (prefers-color-scheme: dark) {
    input:-webkit-autofill {
      -webkit-text-fill-color: #e8eaf2;
      -webkit-box-shadow: 0 0 0 1000px #1c2030 inset;
      caret-color: #e8eaf2;
    }
  }
  .peek { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: #8a8fa3; display: grid; place-items: center; padding: 0; margin: 0; }
  .peek:hover { color: var(--accent); background: rgba(99,102,241,.10); }

  #b { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 11px; font-size: 14.5px; font-weight: 650;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; cursor: pointer;
    transition: transform .12s, box-shadow .15s, filter .15s; box-shadow: 0 8px 20px rgba(99,102,241,.30); }
  #b:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(99,102,241,.38); }
  #b:active:not(:disabled) { transform: translateY(0); filter: brightness(.96); }
  #b:focus-visible { outline: none; box-shadow: 0 8px 20px rgba(99,102,241,.30), var(--focus-ring); }
  #b:disabled { opacity: .6; cursor: default; }

  .err { color: #dc2626; font-size: 12.5px; min-height: 18px; margin-top: 10px; text-align: center; }
  /* 暗底上 #dc2626 对比度不足,换红-400 保可读 */
  @media (prefers-color-scheme: dark) { .err { color: #f87171; } }

  /* 忘记密码:弱化的文字链 + 可展开提示 */
  .forgot { display: block; margin: 12px auto 0; padding: 4px 10px; border: 0; background: none; cursor: pointer;
    font-size: 12px; color: #8a8fa3; border-radius: 8px; }
  .forgot:hover { color: var(--accent); background: rgba(99,102,241,.08); }
  @media (prefers-color-scheme: dark) { .forgot:hover { background: rgba(99,102,241,.14); } }
  .forgot:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .forgot-hint { margin-top: 12px; padding: 10px 13px; border-radius: 10px; text-align: left;
    font-size: 12px; line-height: 1.75; color: #8a8fa3;
    background: rgba(99,102,241,.06); border: 1px dashed rgba(99,102,241,.30); }
  @media (prefers-color-scheme: dark) { .forgot-hint { color: #8b90a8; background: rgba(99,102,241,.10); } }
  .forgot-hint b { color: inherit; font-weight: 650; }
  .forgot-hint a { color: #4f46e5; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .forgot-hint a { color: #a5b4fc; } }
  .forgot-hint a:hover { text-decoration: underline; }
  .forgot-hint code { font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    background: rgba(99,102,241,.14); padding: 1px 5px; border-radius: 5px; }

  /* ---------- 动效与响应式 ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .brand-panel .hero, .brand-panel .flow, .brand-panel .brand-foot { animation: fadeUp .5s ease-out backwards; }
    .brand-panel .flow { animation-delay: .08s; }
    .brand-panel .brand-foot { animation-delay: .16s; }
    .form-panel { animation: fadeUp .5s .1s ease-out backwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* 大品牌水印(装饰) */
  .brand-mark { position: absolute; right: -46px; bottom: -52px; width: 240px; height: 240px; opacity: .10; pointer-events: none; }

  @media (max-width: 760px) {
    body { padding: 14px; align-items: flex-start; }
    .shell { grid-template-columns: 1fr; max-width: 420px; }
    .brand-panel { padding: 26px 24px 22px; }
    .hero { margin-top: 20px; }
    .hero h1 { font-size: 21px; }
    .flow { margin-top: 22px; }
    .node { font-size: 11px; padding: 4px 8px; }
    .flow-hub { width: 48px; height: 48px; }
    .brand-mark, .glow { display: none; }
    .brand-foot { padding-top: 16px; }
    .form-panel { padding: 26px 24px 30px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="brand-panel" aria-hidden="true">
    <span class="glow glow-a"></span><span class="glow glow-b"></span>
    <svg class="brand-mark" viewBox="0 0 64 64"><defs><linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#c4b5fd"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#gm)"/><path d="M10 32 L24 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M18 25 L10 32 L18 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polygon points="32,16 44,24 44,40 32,48 20,40 20,24" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M35 22 L28 33 L34 33 L29 44" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 32 L54 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M46 25 L54 32 L46 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>

    <div class="brand-row">
      <svg viewBox="0 0 64 64" width="36" height="36"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M10 32 L24 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M18 25 L10 32 L18 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polygon points="32,16 44,24 44,40 32,48 20,40 20,24" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M35 22 L28 33 L34 33 L29 44" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 32 L54 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M46 25 L54 32 L46 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="name">Rel<em>ay</em></span>
    </div>

    <div class="hero">
      <h1>万物皆可<em>中转</em></h1>
      <p>Relay · 自托管 LLM 中转站 —— 任意模型供应商，收敛为一个入口</p>
    </div>

    <div class="flow" aria-hidden="true">
      <div class="flow-col">
        <span class="node">OpenAI</span>
        <span class="node">Claude</span>
        <span class="node">DeepSeek</span>
        <span class="node">通义千问</span>
        <span class="node">私有部署</span>
      </div>
      <span class="flow-wire"></span>
      <div class="flow-hub">
        <span class="ring r1"></span><span class="ring r2"></span>
        <svg viewBox="0 0 64 64" width="44" height="44"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M10 32 L24 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M18 25 L10 32 L18 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polygon points="32,16 44,24 44,40 32,48 20,40 20,24" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M35 22 L28 33 L34 33 L29 44" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 32 L54 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M46 25 L54 32 L46 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <span class="flow-wire"></span>
      <div class="flow-col out">
        <span class="node">SDK / 应用</span>
        <span class="node">团队共享</span>
        <span class="node">统一账单</span>
      </div>
    </div>
    <span class="flow-cap" aria-hidden="true">任意上游 → 一个入口 · 一把 Key</span>

    <div class="brand-foot"><span class="dot"></span>自托管 LLM API 网关 · 单二进制</div>
  </aside>

  <main class="form-panel">
    <h2>欢迎回来</h2>
    <div class="sub2">登录后按账号身份自动进入对应工作台</div>
    <form id="f">
      <label for="u">账号名</label>
      <input id="u" autocomplete="username" required>
      <label for="p">密码</label>
      <div class="field">
        <input id="p" type="password" autocomplete="current-password" required style="padding-right:42px">
        <button type="button" class="peek" id="peek" aria-label="显示或隐藏密码">
          <svg id="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button id="b" type="submit">登 录</button>
      <div class="err" id="e" role="alert" aria-live="polite"></div>
      <button type="button" class="forgot" id="forgot" aria-expanded="false" aria-controls="forgotHint">忘记密码?</button>
      <div class="forgot-hint" id="forgotHint" hidden>
        <p><b>门户用户</b>：前往<a href="portal/">门户登录页</a>，用邮箱验证码自助重置。</p>
        <p><b>管理员</b>：请联系部署者修改 <code>RELAY_ADMIN__PASSWORD</code> 后重启；已登录时可在「设置 → 管理员账号」自助改密。</p>
      </div>
    </form>
  </main>
</div>
<script>
// 统一登录:相对路径 fetch,根路径部署与任意子路径反代(含剥前缀模式)均可用。
// 成功后按角色把令牌写入对应应用的 localStorage 键,两套 API 鉴权零改动。
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("b");
  const err = document.getElementById("e");
  btn.disabled = true; err.textContent = "";
  try {
    const res = await fetch("api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data && data.error && data.error.message) || "登录失败");
    if (data.role === "admin") {
      localStorage.setItem("relay_admin_token", data.token);
      location.href = "admin/";
    } else {
      localStorage.setItem("relay_portal_token", data.token);
      location.href = "portal/";
    }
  } catch (e) {
    err.textContent = e.message || "登录失败";
  } finally {
    btn.disabled = false;
  }
});
// 密码可见性切换
document.getElementById("peek").addEventListener("click", () => {
  const p = document.getElementById("p");
  p.type = p.type === "password" ? "text" : "password";
  p.focus();
});
// 忘记密码:展开/收起提示
document.getElementById("forgot").addEventListener("click", () => {
  const hint = document.getElementById("forgotHint");
  const btn = document.getElementById("forgot");
  hint.hidden = !hint.hidden;
  btn.setAttribute("aria-expanded", String(!hint.hidden));
});
</script>
</body>
</html>
