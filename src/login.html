<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · 统一登录</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f5fa; color: #1a1d27; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #101218; color: #e8eaf2; } }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e4e6ef; border-radius: 16px;
    padding: 32px 28px; box-shadow: 0 10px 30px rgba(30,35,60,.08); }
  @media (prefers-color-scheme: dark) { .card { background: #181b24; border-color: #2a2e3c; box-shadow: 0 10px 30px rgba(0,0,0,.4); } }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .brand span { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .sub { text-align: center; font-size: 13px; color: #8a8fa3; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #8a8fa3; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d5d8e4; border-radius: 10px; font-size: 14px;
    background: transparent; color: inherit; outline: none; }
  @media (prefers-color-scheme: dark) { input { border-color: #333849; } }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #dc2626; font-size: 12px; min-height: 16px; margin-top: 10px; text-align: center; }
  .links { display: flex; justify-content: center; gap: 18px; margin-top: 18px; font-size: 12px; }
  .links a { color: #6366f1; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="34" height="34"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M10 32 L24 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M18 25 L10 32 L18 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polygon points="32,16 44,24 44,40 32,48 20,40 20,24" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M35 22 L28 33 L34 33 L29 44" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 32 L54 32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M46 25 L54 32 L46 39" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span>Rel<span style="color:#6366f1">ay</span></span>
  </div>
  <div class="sub">统一登录 · 管理员与用户按身份自动分流</div>
  <form id="f">
    <label for="u">用户名</label>
    <input id="u" autocomplete="username" required>
    <label for="p">密码</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">登 录</button>
    <div class="err" id="e"></div>
  </form>
  <div class="links">
    <a href="admin/">直接进入管理后台</a>
    <a href="portal/">直接进入用户门户</a>
  </div>
</div>
<script>
// 统一登录:相对路径 fetch,根路径部署与任意子路径反代(含剥前缀模式)均可用。
// 成功后按角色把令牌写入对应应用的 localStorage 键,两套 API 鉴权零改动。
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("b");
  const err = document.getElementById("e");
  btn.disabled = true; err.textContent = "";
  try {
    const res = await fetch("api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data && data.error && data.error.message) || "登录失败");
    if (data.role === "admin") {
      localStorage.setItem("relay_admin_token", data.token);
      location.href = "admin/";
    } else {
      localStorage.setItem("relay_portal_token", data.token);
      location.href = "portal/";
    }
  } catch (e) {
    err.textContent = e.message || "登录失败";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
