[package]
name = "relay"
version = "0.7.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }
dashmap = "6"
arc-swap = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
bytes = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.8"
async-stream = "0.3"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tower-http = { version = "0.5", features = ["fs"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
aes-gcm = "0.10"
hkdf = "0.12"
argon2 = "0.5"
base64 = "0.22"
# 支付渠道:支付宝 RSA2 签名(RSASSA-PKCS1-v1_5 + SHA256)与回调验签。
# 支付宝无官方 Rust SDK,签名需自行实现;rsa/pkcs8 已在依赖树中,此处仅为扶正。
rsa = { version = "0.9", features = ["sha2", "pem"] }
percent-encoding = "2.3"
# 支付渠道:碳基圈(一人付)Webhook 验签 HMAC-SHA256。
hmac = "0.12"
# 支付渠道:校验回调/返回地址(HTTPS、443、同域、无私网地址)。
url = "2.5"

[profile.release]
lto = "thin"
